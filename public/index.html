<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodChoose — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --orange: #E85A2A; --brown: #2C1810; --gold: #F9C74F;
      --cream: #FFF8F3; --muted: #8B6554; --text: #1A1209; --border: #F0E6DE;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--brown);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overflow-x: hidden; position: relative;
    }
    .bg-pattern {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(circle at 20% 50%, rgba(232,90,42,0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(249,199,79,0.08) 0%, transparent 40%),
        radial-gradient(circle at 60% 80%, rgba(232,90,42,0.1) 0%, transparent 50%);
    }
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image: linear-gradient(rgba(255,248,243,0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,248,243,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .float-elem {
      position: fixed; z-index: 0; font-size: 80px; opacity: 0.04;
      animation: floatAnim 8s ease-in-out infinite; user-select: none;
    }
    .float-elem:nth-child(1) { top:10%; left:5%; animation-delay:0s; }
    .float-elem:nth-child(2) { top:30%; right:8%; animation-delay:2s; }
    .float-elem:nth-child(3) { bottom:20%; left:10%; animation-delay:4s; }
    .float-elem:nth-child(4) { bottom:10%; right:5%; animation-delay:1s; }
    .float-elem:nth-child(5) { top:60%; left:50%; animation-delay:3s; }
    @keyframes floatAnim {
      0%,100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }

    .login-container {
      position: relative; z-index: 1;
      width: 100%; max-width: 480px; padding: 20px;
    }
    .login-card {
      background: var(--cream); border-radius: 24px;
      padding: 40px 40px 36px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,248,243,0.1);
      animation: cardIn 0.6s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes cardIn {
      from { opacity:0; transform: translateY(30px) scale(0.96); }
      to { opacity:1; transform: translateY(0) scale(1); }
    }

    .logo-wrap { text-align: center; margin-bottom: 28px; }
    .logo-icon {
      width: 64px; height: 64px; background: var(--orange); border-radius: 18px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 28px; margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(232,90,42,0.35);
    }
    .logo-title {
      font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 900;
      color: var(--brown); letter-spacing: -0.5px;
    }
    .logo-title span { color: var(--orange); }
    .logo-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

    /* TABS */
    .tabs {
      display: flex; background: #F0E6DE; border-radius: 12px;
      padding: 4px; margin-bottom: 28px;
    }
    .tab-btn {
      flex: 1; padding: 10px; border: none; background: transparent;
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
      color: var(--muted); border-radius: 9px; cursor: pointer; transition: all 0.2s;
    }
    .tab-btn.active {
      background: white; color: var(--brown);
      box-shadow: 0 2px 8px rgba(44,24,16,0.12);
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity:0; transform: translateY(4px); } to { opacity:1; transform: translateY(0); } }

    /* FORM */
    .form-label {
      display: block; font-size: 11px; font-weight: 600;
      color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;
    }
    .form-group { margin-bottom: 16px; }
    .form-input {
      width: 100%; padding: 13px 16px;
      background: white; border: 2px solid var(--border);
      border-radius: 12px; font-size: 14px; font-family: 'DM Sans', sans-serif;
      color: var(--text); transition: all 0.2s; outline: none;
    }
    .form-input:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 4px rgba(232,90,42,0.1);
    }
    .form-input::placeholder { color: #C4A898; }
    select.form-input { cursor: pointer; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .btn-main {
      width: 100%; padding: 15px;
      background: var(--orange); color: white;
      border: none; border-radius: 12px;
      font-size: 15px; font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer; transition: all 0.2s;
      margin-top: 6px; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-main:hover { background: #D14D22; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(232,90,42,0.35); }
    .btn-main:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .error-msg {
      background: #FEE2E2; color: #991B1B;
      border-radius: 10px; padding: 12px 16px;
      font-size: 13px; margin-top: 14px; display: none;
      border: 1px solid #FCA5A5;
    }
    .error-msg.show { display: block; animation: fadeIn 0.3s ease; }

    .success-msg {
      background: #D1FAE5; color: #065F46;
      border-radius: 10px; padding: 12px 16px;
      font-size: 13px; margin-top: 14px; display: none;
      border: 1px solid #6EE7B7;
    }
    .success-msg.show { display: block; animation: fadeIn 0.3s ease; }

    .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0 16px; }
    .hint { text-align: center; font-size: 12px; color: var(--muted); line-height: 1.5; }

    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading .spinner { display: inline-block; }

    .section-title {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 1px; color: var(--muted); margin: 20px 0 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    @media (max-width: 480px) {
      .login-card { padding: 32px 20px 28px; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>
  <div class="bg-grid"></div>
  <span class="float-elem">🍽️</span>
  <span class="float-elem">🥗</span>
  <span class="float-elem">🍜</span>
  <span class="float-elem">☕</span>
  <span class="float-elem">🥤</span>

  <div class="login-container">
    <div class="login-card">
      <div class="logo-wrap">
        <div class="logo-icon">🍽️</div>
        <div class="logo-title">Food<span>Choose</span></div>
        <div class="logo-sub">Plateforme de choix de repas</div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login')">🔑 Se connecter</button>
        <button class="tab-btn" onclick="switchTab('register')">✨ Créer un compte</button>
      </div>

      <!-- ── LOGIN ── -->
      <div class="tab-panel active" id="tab-login">
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label" for="loginId">🪪 Identifiant</label>
            <input class="form-input" type="text" id="loginId" placeholder="Ex: jdupont ou admin" autocomplete="username" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="loginPwd">🔒 Mot de passe</label>
            <input class="form-input" type="password" id="loginPwd" placeholder="Votre mot de passe" autocomplete="current-password" required>
          </div>
          <button class="btn-main" type="submit" id="loginBtn">
            <span class="spinner" id="loginSpinner"></span>
            🚀 Se connecter
          </button>
          <div class="error-msg" id="loginError"></div>
        </form>
        <hr class="divider">
        <p class="hint">Pas encore de compte ? Cliquez sur <strong>Créer un compte</strong> ci-dessus.</p>
      </div>

      <!-- ── REGISTER ── -->
      <div class="tab-panel" id="tab-register">
        <form id="registerForm" onsubmit="handleRegister(event)">
          <div class="section-title">👤 Informations personnelles</div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="regFirst">Prénom *</label>
              <input class="form-input" type="text" id="regFirst" placeholder="Jean" required oninput="suggestRegId()">
            </div>
            <div class="form-group">
              <label class="form-label" for="regLast">Nom *</label>
              <input class="form-input" type="text" id="regLast" placeholder="Dupont" required oninput="suggestRegId()">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="regEmail">📧 Email *</label>
            <input class="form-input" type="email" id="regEmail" placeholder="jean.dupont@email.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="regPhone">📱 Téléphone (livraison)</label>
            <input class="form-input" type="tel" id="regPhone" placeholder="+226 70 00 00 00">
          </div>

          <div class="section-title">🏢 Organisation</div>
          <div class="form-group">
            <label class="form-label" for="regCompanyType">Type d'organisation</label>
            <select class="form-input" id="regCompanyType">
              <option value="">-- Sélectionner --</option>
              <option value="Entreprise">🏢 Entreprise</option>
              <option value="Hôpital">🏥 Hôpital</option>
              <option value="Pharmacie">💊 Pharmacie</option>
              <option value="Université">🎓 Université</option>
              <option value="École">🏫 École</option>
              <option value="Clinique">🩺 Clinique</option>
              <option value="Banque">🏦 Banque</option>
              <option value="Autre">📌 Autre</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="regCompany">Nom de l'organisation</label>
            <input class="form-input" type="text" id="regCompany" placeholder="Ex: CHU de Ouagadougou">
          </div>

          <div class="section-title">🔐 Identifiants de connexion</div>
          <div class="form-group">
            <label class="form-label" for="regId">Identifiant *</label>
            <input class="form-input" type="text" id="regId" placeholder="jdupont" required>
            <div style="font-size:11px;color:var(--muted);margin-top:4px">Suggestion automatique — modifiable</div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="regPwd">Mot de passe *</label>
              <input class="form-input" type="password" id="regPwd" placeholder="Min. 6 caractères" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="regPwd2">Confirmer *</label>
              <input class="form-input" type="password" id="regPwd2" placeholder="Répéter" required>
            </div>
          </div>

          <button class="btn-main" type="submit" id="regBtn">
            <span class="spinner" id="regSpinner"></span>
            🎉 Créer mon compte
          </button>
          <div class="error-msg" id="regError"></div>
          <div class="success-msg" id="regSuccess"></div>
        </form>
      </div>

    </div>
  </div>

  <script>
    const token = localStorage.getItem('fc_token');
    const role = localStorage.getItem('fc_role');
    if (token && role) window.location.href = role === 'admin' ? '/admin' : '/employee';

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', (i === 0) === (tab === 'login')));
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    }

    function suggestRegId() {
      const first = document.getElementById('regFirst').value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,'');
      const last = document.getElementById('regLast').value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,'');
      if (first || last) document.getElementById('regId').value = first.charAt(0) + last;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');
      btn.disabled = true; btn.classList.add('loading');
      err.classList.remove('show');
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            employeeId: document.getElementById('loginId').value.trim(),
            password: document.getElementById('loginPwd').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erreur de connexion');
        localStorage.setItem('fc_token', data.token);
        localStorage.setItem('fc_role', data.role);
        localStorage.setItem('fc_name', data.name);
        localStorage.setItem('fc_eid', data.employeeId);
        window.location.href = data.role === 'admin' ? '/admin' : '/employee';
      } catch (e2) {
        err.textContent = '❌ ' + e2.message;
        err.classList.add('show');
      } finally {
        btn.disabled = false; btn.classList.remove('loading');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('regBtn');
      const err = document.getElementById('regError');
      const suc = document.getElementById('regSuccess');
      err.classList.remove('show'); suc.classList.remove('show');

      const pwd = document.getElementById('regPwd').value;
      const pwd2 = document.getElementById('regPwd2').value;
      if (pwd !== pwd2) { err.textContent = '❌ Les mots de passe ne correspondent pas'; err.classList.add('show'); return; }
      if (pwd.length < 6) { err.textContent = '❌ Minimum 6 caractères pour le mot de passe'; err.classList.add('show'); return; }

      btn.disabled = true; btn.classList.add('loading');
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            firstName: document.getElementById('regFirst').value.trim(),
            lastName: document.getElementById('regLast').value.trim(),
            email: document.getElementById('regEmail').value.trim(),
            password: pwd,
            phoneNumber: document.getElementById('regPhone').value.trim(),
            companyName: document.getElementById('regCompany').value.trim(),
            companyType: document.getElementById('regCompanyType').value,
            employeeId: document.getElementById('regId').value.trim()
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erreur de création');
        localStorage.setItem('fc_token', data.token);
        localStorage.setItem('fc_role', data.role);
        localStorage.setItem('fc_name', data.name);
        localStorage.setItem('fc_eid', data.employeeId);
        suc.textContent = '🎉 Compte créé ! Redirection en cours...';
        suc.classList.add('show');
        setTimeout(() => { window.location.href = '/employee'; }, 1200);
      } catch (e2) {
        err.textContent = '❌ ' + e2.message;
        err.classList.add('show');
      } finally {
        btn.disabled = false; btn.classList.remove('loading');
      }
    }
  </script>
</body>
</html>
